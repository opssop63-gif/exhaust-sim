<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>배기음 시뮬레이터</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: one-screen instrument cluster. Tachometer on the left, controls on the right; stacks on phones. */
:root {
  --bg: #0c0e11;
  --panel: #15191f;
  --line: #262c35;
  --fg: #e7eaee;
  --dim: #8b94a1;
  --amber: #ffad33;
  --red: #ff4b3e;
  --f-num: 'Oxanium', ui-monospace, 'SF Mono', monospace;
  --f-body: 'IBM Plex Sans KR', system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--f-body);
  font-size: 15px;
  box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.app {
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
  gap: 24px;
  max-width: 1200px;
  margin: 0 auto;
  align-items: center;
  min-height: 100%;
}
@media (max-width: 760px) { .app { grid-template-columns: minmax(0, 1fr); } }
.gauge { display: flex; justify-content: center; min-width: 0; }
canvas { width: 100%; max-width: 560px; aspect-ratio: 1; display: block; }
.controls { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--f-num); font-size: 20px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; margin: 0; color: var(--amber); }
.status { font-size: 13px; color: var(--dim); }
.label { font-size: 12px; letter-spacing: .06em; color: var(--dim); margin-bottom: 8px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
button {
  font: inherit; color: inherit; background: var(--panel);
  border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
  cursor: pointer; text-align: left;
}
button[aria-pressed="true"] { border-color: var(--amber); background: color-mix(in srgb, var(--amber) 13%, var(--panel)); }
button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.chip { display: grid; gap: 6px; }
.chip { padding: 8px 8px 12px; }
.chip img { width: 100%; aspect-ratio: 2.2 / 1; object-fit: cover; border-radius: 6px; display: block; filter: saturate(.8) brightness(.75); transition: filter .2s; }
.chip[aria-pressed="true"] img { filter: none; }
.chip b, .chip span { padding-inline: 4px; }
.chip b { display: block; font-weight: 600; }
.chip span { font-size: 12px; color: var(--dim); }
.grid3 button { text-align: center; }
.row { display: flex; gap: 12px; align-items: stretch; }
#start {
  flex: 0 0 112px; height: 112px; align-self: center; border-radius: 50%; text-align: center;
  font-family: var(--f-num); font-weight: 700; letter-spacing: .08em; font-size: 15px;
  border: 2px solid var(--line); line-height: 1.25;
}
#start[aria-pressed="true"] { border-color: var(--red); color: var(--red); background: color-mix(in srgb, var(--red) 12%, var(--panel)); }
.pedal {
  position: relative; flex: 1; min-height: 130px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--panel); overflow: hidden;
  touch-action: none; cursor: ns-resize;
}
.pedal .fill {
  position: absolute; inset: auto 0 0 0; height: calc(var(--t, 0) * 100%);
  background: linear-gradient(to top, color-mix(in srgb, var(--amber) 55%, transparent), color-mix(in srgb, var(--red) 60%, transparent));
}
.pedal .txt { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center; pointer-events: none; padding: 8px; }
.pedal .txt b { font-family: var(--f-num); font-size: 26px; font-variant-numeric: tabular-nums; }
.pedal .txt span { font-size: 12px; color: var(--fg); opacity: .75; }
.vol { display: flex; align-items: center; gap: 12px; }
.vol input { flex: 1; accent-color: var(--amber); }
.vol output { font-family: var(--f-num); width: 3ch; text-align: right; font-variant-numeric: tabular-nums; }
.note { font-size: 12px; color: var(--dim); line-height: 1.6; margin: 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <div class="gauge"><canvas id="tach" aria-label="회전계"></canvas></div>

  <div class="controls">
    <header>
      <h1>Exhaust Sim</h1>
      <div class="status" id="status">시동 버튼을 눌러 시작하세요</div>
    </header>

    <div>
      <div class="label">엔진</div>
      <div class="grid2" id="engines"></div>
    </div>

    <div>
      <div class="label">모드</div>
      <div class="grid3" id="modes">
        <button data-mode="rev" aria-pressed="true">제자리 레브</button>
        <button data-mode="drive" aria-pressed="false">주행 시뮬</button>
        <button data-mode="gps" aria-pressed="false">GPS 연동</button>
      </div>
    </div>

    <div class="row">
      <button id="start" aria-pressed="false">ENGINE<br>START</button>
      <div class="pedal" id="pedal" role="slider" aria-label="가속 페달" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
        <div class="fill"></div>
        <div class="txt"><b id="tval">0%</b><span>가속 페달 · 위쪽을 누를수록 깊게 밟아요 (키보드: 스페이스)</span></div>
      </div>
    </div>

    <div class="vol">
      <span class="label" style="margin:0">볼륨</span>
      <input id="vol" type="range" min="0" max="100" value="70">
      <output id="volv">70</output>
    </div>

    <div class="vol">
      <span class="label" style="margin:0">속도 보정</span>
      <input id="calib" type="range" min="-5" max="10" step="0.5" value="0">
      <output id="calibv" style="width:6ch">0%</output>
    </div>

    <p class="note">GPS 연동은 실제 속도에 맞춰 기어와 회전수를 계산하고, 가속할 때 소리가 커집니다. 계기판보다 낮게 나오면 속도 보정을 올리세요 (보통 +3~5%). 운전 중에는 화면을 조작하지 마세요.</p>
  </div>
</div>

const WORKLET = `
class Exhaust extends AudioWorkletProcessor {
  static get parameterDescriptors() {
    return [{ name: 'rpm', defaultValue: 0 }, { name: 'throttle', defaultValue: 0 }];
  }
  constructor(opts) {
    super();
    this.cfg = Object.assign({ cyl: 8, body: 80, uneven: .1, pattern: [1], rasp: .5 }, opts.processorOptions || {});
    this.acc = 0; this.idx = 0; this.next = 1; this.voices = [];
    this.dc = 0; this.dcPrev = 0;
    this.port.onmessage = e => Object.assign(this.cfg, e.data);
  }
  process(_, outputs, params) {
    const out = outputs[0][0], c = this.cfg, dt = 1 / sampleRate;
    const rpm = params.rpm[0], thr = params.throttle[0];
    const fireHz = rpm / 60 * c.cyl / 2;
    const decay = Math.max(90, fireHz * 1.6);
    const amp = .35 + .65 * thr;
    for (let i = 0; i < out.length; i++) {
      this.acc += fireHz * dt;
      if (rpm > 50 && this.acc >= this.next) {
        this.acc -= this.next;
        this.idx = (this.idx + 1) % c.cyl;
        const p = c.pattern[this.idx % c.pattern.length];
        // uneven spacing between pulses is what makes a cross-plane V8 burble
        this.next = 1 + (p - .8) * c.uneven * 2 + (Math.random() - .5) * .04;
        if (this.voices.length < 48) this.voices.push({ t: 0, a: amp * p * (.9 + Math.random() * .2), f: c.body * (.95 + Math.random() * .1) });
      }
      let s = 0;
      for (let v = this.voices.length - 1; v >= 0; v--) {
        const vo = this.voices[v];
        const env = Math.exp(-vo.t * decay);
        if (env < .002) { this.voices.splice(v, 1); continue; }
        const att = Math.min(1, vo.t * 4000);
        s += vo.a * att * env * (Math.sin(6.2832 * vo.f * vo.t) + .6)

function liftOff() {
  const t = ctx.currentTime;
  const n = Math.round(2 + eng.crackle * 6 * (rpm / eng.red + .3));
  for (let i = 0; i < n; i++) bang(t + .06 + Math.random() * .9 * (.4 + eng.crackle), .5 + Math.random() * .4);
  if (eng.turbo && boost > .4) burst(t + .02, 2500, .45, .25 * boost * eng.turbo, true);
}
function updateAudio(eff) {
  const t = ctx.currentTime, r = Math.max(rpm, 60);
  const f = r / 60 * eng.cyl / 2;
  // loudness follows road speed more than pedal: a Tesla cruises at 100 km/h on a light foot,
  // so town speeds stay quiet and highway cruising fills the cabin
  const road = mode === 'rev' ? 1 : .55 + .8 * clamp(speed / 100, 0, 1.15);
  const load = (.45 + eff * .3 + (rpm / eng.red) * .15) * road;
  if (A.wk) {
    A.wk.parameters.get('rpm').setTargetAtTime(running ? r : 0, t, .015);
    A.wk.parameters.get('throttle').setTargetAtTime(eff, t, .03);
  } else {
    A.o1.o.frequency.setTargetAtTime(f, t, .015);
    A.o2.o.frequency.setTargetAtTime(f / 2, t, .015);
    A.o3.o.frequency.setTargetAtTime(f * 2.01, t, .015);
    A.lfo.frequency.setTargetAtTime(r / 120, t, .03);
    A.lp.frequency.setTargetAtTime(250 + f * eng.bright * (1.6 + eff * 5), t, .03);
  }
  A.nbp.frequency.setTargetAtTime(f * 3.5, t, .03);
  A.ng.gain.setTargetAtTime((.05 + eff * .22 * (rpm / eng.red + .3)) * (A.wk ? .35 : 1), t, .03);
  A.bus.gain.setTargetAtTime(running ? load : 0, t, running ? .04 : .5);
  if (eng.turbo) {
    A.turbo.frequency.setTargetAtTime(1800 + rpm * .7 * boost, t, .08);
    A.tg.gain.setTargetAtTime(.035 * eng.turbo * boost * boost, t, .08);
  }
}

// ---------- Engine ----------
async function startEngine() {
  if (!ctx) await buildAudio();
  try { await ctx.resume(); } catch (e) {}
  running = true; startT = 0; rpm = 0;
  $('start').setAttribute('aria-pressed', 'true');
  $('start').innerHTML = 'ENGINE<br>STOP';
  status(`${eng.name} 시동 · ${A.wk ? '펄스 엔진' : '기본 엔진'}`);
  try { navigator.wakeLock?.request('screen').catch(() => {}); } catch (e) {}
}
function stopEngine() {
  running = false; startT = -1;
  $('start').setAttribute('aria-pressed', 'false');
  $('start').innerHTML = 'ENGINE<br>START';
  status('시동 꺼짐');
}

function physics(dt) {
  throttle += (Math.max(padT, keyT, mode === 'gps' ? gpsThrottle() : 0) - throttle) * Math.min(1, dt * 9);
  if (!running) { rpm = Math.max(0, rpm - dt * 2500); return 0; }

  // starter: crank, catch, settle
  if (startT >= 0) {
    startT += dt;
    if (startT < .75) { rpm = 260 + Math.sin(startT * 60) * 90; return 0; }
    if (startT < .8) rpm = eng.idle * 1.9;
    if (startT > 1.6) startT = -1;
  }

  cut = Math.max(0, cut - dt); shiftCut = Math.max(0, shiftCut - dt);
  let eff = (cut > 0 || shiftCut > 0) ? 0 : throttle;
  boost += ((eff > .3 ? eff : 0) - boost) * dt * (eff > boost ? 1.6 : 4);

  if (prevThrottle > .55 && throttle < .25 && rpm > eng.red * .35) liftOff();
  prevThrottle = throttle;

  // idle lope (strongest on the V8) plus a little running roughness that grows with load
  idleT += dt;
  jit += ((Math.random() - .5) * 220 - jit) * Math.min(1, dt * 7);
  const lope = Math.sin(idleT * Math.PI * 2.6) * (40 + eng.burble * 160) + jit * (.4 + throttle);

  if (mode === 'rev') {
    gear = 0;
    const target = eng.idle + eff * (eng.red - eng.idle) * 1.06 + (eff < .15 ? lope : jit * .5);
    rpm += (target - rpm) * Math.min(1, dt * (target > rpm ? 4.2 : 2.0));
    if (rpm >= eng.red) { rpm = eng.red - 250; cut = .06; }
    return eff;
  }

  const prevSpeed = speed;
  if (mode === 'drive') {
    if (gear < 1) gear = 1;
    const a = eff * 11 * GEARS[gear - 1] - (.8 + .00035 * speed * speed);
    speed = Math.max(0, speed + a * dt);
  } else {
    // between 1 Hz fixes, project forward with the last measured acceleration
    const since = Math.min(1.2, (performance.now() - gpsFixAt) / 1000);
    const pred = gpsSpeed == null ? 0 : Math.max(0, gpsSpeed + gpsAccel * since);
    speed += (pred * (1 + calib / 100) - speed) * Math.min(1, dt * 4);
  }
  liveAccel += ((speed - prevSpeed) / Math.max(dt, .001) - liveAccel) * Math.min(1, dt * 5);

  shiftCool = Math.max(0, shiftCool - dt);
  if (gear < 1) gear = 1;
  const rAt = g => speed * GEARS[g - 1] * K;
  if (shiftCool === 0) {
    if (mode === 'drive') {
      if (rpm > eng.red * .97 && gear < 6) shift(1);
      else if (gear > 1 && rAt(gear - 1) < eng.red * .75 && rpm < 1700) shift(-1);
    } else {
      // gentle driving shifts early; only hard acceleration holds gears toward redline
      const upAt = 2200 + Math.pow(throttle, 3) * (eng.red * .92 - 2200);
      if (speed < 4) gear = 1;
      else if (gear < 6 && liveAccel > -1 && rAt(gear) > upAt) shift(1); // never upshift while slowing
      else if (gear > 1 && (rAt(gear) < 1300 || (liveAccel < -3 && rAt(gear - 1) < eng.red * .6 && rAt(gear) < 2200))) shift(-1);
    }
  }

  blip = Math.max(0, blip - dt * 1500);
  // accelerating loads the drivetrain: revs flare above road speed, like a slipping converter
  const flare = mode === 'gps' ? clamp(liveAccel / 8, 0, 1) * 600 : 0;
  const base = rAt(gear);
  let target = Math.max(eng.idle, base) + blip + flare + (base < eng.idle * 1.3 ? lope : jit * (.3 + throttle));
  if (speed < 18) target = Math.max(target, eng.idle + eff * 2400);
  // right after a shift revs snap to the new gear, otherwise they follow smoothly
  rpm += (target - rpm) * Math.min(1, dt * (shiftCool > .4 ? 16 : 8));
  if (rpm > eng.red) { rpm = eng.red - 200; cut = .06; }

  // overrun: off throttle while slowing keeps popping, fading after a few seconds
  const overrun = throttle < .2 && liveAccel < -2 && rpm > 1800;
  overrunT = overrun ? overrunT + dt : 0;
  if (overrun && A) {
    crackT -= dt;
    if (crackT <= 0) {
      const fade = Math.max(.25, 1 - overrunT / 4);
      bang(ctx.currentTime, (.4 + Math.min(1, -liveAccel / 10) * .6) * fade);
      crackT = (.06 + Math.random() * .3) / (eng.crackle * fade + .2);
    }
  }
  return eff;
}

function shift(dir) {
  gear += dir; shiftCool = .6;
  if (!A) return;
  const t = ctx.currentTime;
  if (dir > 0) {
    shiftCut = .12;
    rpm += 250; // brief flare as the clutch lets go, then revs fall to the new gear
    click(t + .01, .35);
    thump(t + .02, 70, .5, .1);
    if (eng.turbo && boost > .3) burst(t + .03, 2500, .35, .2 * boost * eng.turbo, true);
  } else {
    blip = 700; // rev-match
    thump(t, 80, .4, .08);
    if (Math.random() < .5 + eng.crackle * .5) bang(t + .12 + Math.random() * .1, .7);
  }
}

// ---------- GPS ----------
// throttle follows how fast speed is rising: even gentle acceleration opens it up
// slowing down closes it completely, so decelerating is audible and pops right away
function gpsThrottle() {
  if (gpsSpeed == null || liveAccel < -1) return 0;
  return Math.max(gpsSpeed > 5 ? .1 : 0, Math.sqrt(clamp(liveAccel / 8, 0, 1)));
}
function startGps() {
  if (!navigator.geolocation) { status('이 브라우저는 위치를 지원하지 않아요'); return; }
  status('GPS 신호를 찾는 중…');
  try {
    gpsWatch = navigator.geolocation.watchPosition(p => {
      const now = p.timestamp;
      let s = p.coords.speed;
      if (s == null && gpsLast) {
        const dLat = (p.coords.latitude - gpsLast.lat) * 111320;
        const dLon = (p.coords.longitude - gpsLast.lon) * 111320 * Math.cos(p.coords.latitude * Math.PI / 180);
        s = Math.hypot(dLat, dLon) / Math.max(.2, (now - gpsLast.t) / 1000);
      }
      const kmh = (s ?? 0) * 3.6;
      if (gpsLast) gpsAccel = gpsAccel * .4 + .6 * ((kmh - gpsLast.kmh) / Math.max(.2, (now - gpsLast.t) / 1000));
      gpsLast = { lat: p.coords.latitude, lon: p.coords.longitude, t: now, kmh };
      gpsSpeed = kmh; gpsFixAt = performance.now();
      status(`GPS 연동 · ${Math.round(kmh * (1 + calib / 100))} km/h`);
    }, err => {
      status(err.code === 1
        ? '위치 권한이 없어요. 브라우저에서 위치를 허용하거나, 직접 올린 페이지에서 열어 주세요'
        : 'GPS 신호를 받지 못했어요');
    }, { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 });
  } catch (e) { status('이 화면에서는 위치를 쓸 수 없어요'); }
}
function stopGps() {
  if (gpsWatch != null) navigator.geolocation.clearWatch(gpsWatch);
  gpsWatch = null; gpsSpeed = null; gpsLast = null; gpsAccel = 0;
  if (running) status(`${eng.name} 시동`);
}

// ---------- Tachometer ----------
const cv = $('tach'), g2d = cv.getContext('2d');
function resize() {
  const d = devicePixelRatio || 1, w = cv.clientWidth;
  cv.width = w * d; cv.height = w * d; g2d.setTransform(d, 0, 0, d, 0, 0);
}
addEventListener('resize', resize);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const C = { fg: css('--fg'), dim: css('--dim'), line: css('--line'), amber: css('--amber'), red: css('--red'), num: css('--f-num'), panel: css('--panel') };

function draw() {
  const w = cv.clientWidth, cx = w / 2, cy = w / 2, R = w * .44;
  g2d.clearRect(0, 0, w, w);
  const max = (Math.ceil(eng.red / 1000) + 1) * 1000;
  const a0 = Math.PI * .75, span = Math.PI * 1.5;
  const ang = v => a0 + span * clamp(v / max, 0, 1);

  g2d.beginPath(); g2d.arc(cx, cy, R + w * .03, 0, Math.PI * 2); g2d.fillStyle = C.panel; g2d.fill();
  g2d.lineWidth = w * .022; g2d.lineCap = 'butt';
  g2d.beginPath(); g2d.arc(cx, cy, R * .9, a0, a0 + span); g2d.strokeStyle = C.line; g2d.stroke();
  g2d.beginPath(); g2d.arc(cx, cy, R * .9, ang(eng.red), a0 + span); g2d.strokeStyle = C.red; g2d.globalAlpha = .45; g2d.stroke(); g2d.globalAlpha = 1;

  const hot = needle >= eng.red * .92;
  g2d.save(); g2d.shadowColor = hot ? C.red : C.amber; g2d.shadowBlur = w * .03;
  g2d.beginPath(); g2d.arc(cx, cy, R * .9, a0, ang(needle)); g2d.strokeStyle = hot ? C.red : C.amber; g2d.stroke();
  g2d.restore();

  for (let v = 0; v <= max; v += 500) {
    const a = ang(v), major = v % 1000 === 0, ca = Math.cos(a), sa = Math.sin(a);
    const r1 = R * (major ? .74 : .78), r2 = R * .8;
    g2d.beginPath(); g2d.moveTo(cx + ca * r1, cy + sa * r1); g2d.lineTo(cx + ca * r2, cy + sa * r2);
    g2d.lineWidth = major ? 3 : 1.5; g2d.strokeStyle = v >= eng.red ? C.red : (major ? C.fg : C.dim); g2d.stroke();
    if (major) {
      g2d.fillStyle = v >= eng.red ? C.red : C.fg;
      g2d.font = `500 ${w * .045}px ${C.num}`; g2d.textAlign = 'center'; g2d.textBaseline = 'middle';
      g2d.fillText(v / 1000, cx + ca * R * .63, cy + sa * R * .63);
    }
  }

  const a = ang(needle);
  g2d.beginPath(); g2d.moveTo(cx - Math.cos(a) * R * .1, cy - Math.sin(a) * R * .1);
  g2d.lineTo(cx + Math.cos(a) * R * .86, cy + Math.sin(a) * R * .86);
  g2d.lineWidth = 3; g2d.strokeStyle = C.red; g2d.stroke();
  g2d.beginPath(); g2d.arc(cx, cy, w * .025, 0, Math.PI * 2); g2d.fillStyle = C.fg; g2d.fill();

  g2d.textAlign = 'center'; g2d.textBaseline = 'alphabetic';
  g2d.fillStyle = hot ? C.red : C.amber; g2d.font = `700 ${w * .08}px ${C.num}`;
  g2d.fillText(mode === 'rev' || !running ? 'N' : gear, cx, cy - R * .24);
  g2d.fillStyle = C.fg; g2d.font = `700 ${w * .15}px ${C.num}`;
  g2d.fillText(Math.round(speed), cx, cy + R * .5);
  g2d.fillStyle = C.dim; g2d.font = `500 ${w * .034}px ${C.num}`;
  g2d.fillText(`km/h  ·  ${Math.round(rpm).toLocaleString()} rpm`, cx, cy + R * .66);
}

// ---------- Loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  const eff = physics(dt);
  if (A?.ready) updateAudio(eff);
  // underdamped spring: the needle overshoots on every jump and settles with a wobble
  const k = 260, damp = 2 * Math.sqrt(k) * .32;
  needleV += (k * (rpm - needle) - damp * needleV) * dt;
  needle = Math.max(0, needle + needleV * dt);
  pedal.style.setProperty('--t', throttle.toFixed(3));
  $('tval').textContent = Math.round(throttle * 100) + '%';
  pedal.setAttribute('aria-valuenow', Math.round(throttle * 100));
  draw();
  requestAnimationFrame(frame);
}
resize();
document.fonts?.ready.then(resize);
requestAnimationFrame(frame);
</script>

</body>
</html>
